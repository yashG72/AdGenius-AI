[project]
name = "adgenius-backend"
version = "0.1.0"
description = "AdGenius AI - multi-agent creative advertising platform (backend)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]  # generated migration files keep Alembic's style

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import sorting, B: bugbear, UP: modern syntax, ASYNC: async pitfalls
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in default args is idiomatic

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the library as first-party.
known-third-party = ["alembic"]
known-first-party = ["app"]
